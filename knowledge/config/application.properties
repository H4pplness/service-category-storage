# ═══════════════════════════════════════════════════════════════════════
#  DCMS Knowledge – kho tri thức Sản phẩm - Nghiệp vụ đồng bộ từ Confluence
#  Giá trị dạng ${TEN_BIEN:mac_dinh} được lấy từ biến môi trường (giống Spring).
#  Có thể ghi đè bằng file config/application-local.properties (không commit).
# ═══════════════════════════════════════════════════════════════════════

# ───── Máy chủ HTTP (MCP + API quản trị) ─────
server.port=${KNOWLEDGE_PORT:4100}

# ───── Kết nối Confluence ─────
# Loại máy chủ: cloud | datacenter
confluence.type=${CONFLUENCE_TYPE:datacenter}
# URL gốc. Cloud: https://<site>.atlassian.net/wiki – Data Center: https://confluence.congty.vn (kèm context path nếu có)
confluence.base-url=${CONFLUENCE_BASE_URL:http://localhost:8090}
# Cloud: email đăng nhập + API token. Data Center: để trống username và dùng Personal Access Token
# (hoặc điền username + mật khẩu nếu máy chủ chưa bật PAT).
confluence.username=${CONFLUENCE_USERNAME:}
confluence.token=${CONFLUENCE_TOKEN:}
# Múi giờ dùng khi viết điều kiện CQL lastmodified (nên trùng múi giờ của tài khoản kết nối)
confluence.timezone=Asia/Ho_Chi_Minh
confluence.page-size=50
confluence.request-timeout-ms=30000
confluence.max-retries=3

# ───── Phạm vi quét ─────
# Danh sách space key cần quét, phân tách bằng dấu phẩy. Space mới thêm sẽ được quét toàn bộ ở lần chạy kế tiếp.
confluence.spaces=${CONFLUENCE_SPACES:SPNV}
# (Tuỳ chọn) chỉ lấy các trang nằm dưới một trang gốc trong space – mỗi SP-NV là một trang con
# confluence.space.SPNV.root-page-id=123456
# (Tuỳ chọn) chỉ lấy các trang có một trong các label sau
# confluence.space.SPNV.labels=sp-nv,huong-dan-chon
# (Tuỳ chọn) bỏ qua các trang có tiêu đề bắt đầu bằng các tiền tố sau (trang mục lục, trang nhóm...)
confluence.exclude-title-prefixes=[Mục lục],[Template]

# ───── Lịch đồng bộ ─────
# Cron 5 trường (phút giờ ngày tháng thứ) – mặc định chạy đầu mỗi giờ
sync.cron=0 * * * *
# Đối soát toàn bộ id để phát hiện trang bị xoá/di chuyển – mặc định 02:30 hằng ngày
sync.reconcile-cron=30 2 * * *
# Chạy đồng bộ ngay khi khởi động service
sync.run-on-startup=true
# Lùi mốc thời gian khi quét thay đổi (phút) để không sót trang do lệch giờ/độ trễ index của Confluence
sync.overlap-minutes=60

# ───── Lưu trữ & tìm kiếm ─────
storage.path=data/knowledge.db
search.default-limit=10
search.max-limit=20
# Các tiêu đề mục được coi là phần "khi nào nên chọn" – ưu tiên hiển thị trong kết quả tìm kiếm
content.guidance-headings=Khi nào nên chọn,Khi nào chọn,Trường hợp áp dụng,Điều kiện áp dụng,Phạm vi áp dụng
# Giới hạn số ký tự nội dung trả về cho mỗi trang qua MCP
content.max-chars=12000

# ───── MCP server (Streamable HTTP) ─────
mcp.path=/mcp
# Token Mindmate gửi kèm (Authorization: Bearer ...). Để trống = không yêu cầu xác thực.
mcp.auth-token=${KNOWLEDGE_MCP_TOKEN:dcms-knowledge-token-change-me}
# Token cho API quản trị (/api/status, /api/sync...). Để trống = dùng chung mcp.auth-token.
admin.token=${KNOWLEDGE_ADMIN_TOKEN:}
