# ═══════════════════════════════════════════════════════════════════════
#  DCMS server – cấu hình tích hợp trợ lý Mindmate
#  Giá trị dạng ${TEN_BIEN:mac_dinh} được lấy từ biến môi trường.
#  Có thể ghi đè bằng file config/application-local.properties (không commit).
# ═══════════════════════════════════════════════════════════════════════

# Bật/tắt ô chat trợ lý trên giao diện
mindmate.enabled=${MINDMATE_ENABLED:true}
# Địa chỉ mindmate-control-plane
mindmate.base-url=${MINDMATE_BASE_URL:http://localhost:8080}
# Tên workspace trên Mindmate dành cho DCMS (tự tạo nếu chưa có)
mindmate.workspace-name=dcms
mindmate.workspace-description=Trợ lý hỏi đáp Sản phẩm - Nghiệp vụ cho DCMS (Phiếu & Tác vụ)
# File chỉ dẫn agent, được đẩy lên workspace dưới tên AGENTS.md
mindmate.agents-md.path=mindmate/AGENTS.md
# Model alias trên Mindmate (GET /v1/models). Để trống = dùng model đầu tiên khả dụng.
mindmate.model=${MINDMATE_MODEL:}
mindmate.temperature=0.3

# ───── Xác thực Keycloak của Mindmate ─────
mindmate.auth.token-url=${MINDMATE_TOKEN_URL:http://localhost:8081/realms/mindmate/protocol/openid-connect/token}
# Client confidential "dcms" (service account, grant client_credentials)
mindmate.auth.client-id=${MINDMATE_CLIENT_ID:dcms}
mindmate.auth.client-secret=${MINDMATE_CLIENT_SECRET:dcms-secret-change-me}
# (Tuỳ chọn, môi trường dev) dùng tài khoản người dùng thay cho service account – khi điền, dùng grant password
mindmate.auth.username=${MINDMATE_USERNAME:}
mindmate.auth.password=${MINDMATE_PASSWORD:}

# ───── MCP kho tri thức SP-NV (đăng ký vào Mindmate dưới định danh trên) ─────
mindmate.mcp.name=dcms-knowledge
# URL mà mindmate-control-plane gọi tới (localhost cần MINDMATE_MCP_ALLOW_PRIVATE_HOSTS=true bên Mindmate)
mindmate.mcp.url=${KNOWLEDGE_MCP_URL:http://localhost:4100/mcp}
mindmate.mcp.token=${KNOWLEDGE_MCP_TOKEN:dcms-knowledge-token-change-me}
